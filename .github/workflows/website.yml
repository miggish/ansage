# The docs website (website/, pages in docs/): lint it (Biome), build it and check the agent side
# (llms.txt, the .md pages, no leftover JSX) on pull requests and on main. Deploying is
# left to the host (e.g. Vercel's git integration on main).
name: website

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "crates/ansage/src/config.rs"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "crates/ansage/src/config.rs"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint and format (Biome)
        run: bun run lint
      - run: bun run types:check
      - name: Build (config reference from crates/ansage/src/config.rs)
        run: bun run build
      - name: Check the Markdown for agents
        run: |
          bun run start &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
          bun run check:md
