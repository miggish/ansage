[package]
name = "ansage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12"
libfuzzer-sys = "0.4"
ansage-bgp = { path = "../../crates/ansage-bgp" }
ansage-netlink = { path = "../../crates/ansage-netlink" }

# Keep the fuzz crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netlink"
path = "fuzz_targets/netlink.rs"
test = false
doc = false
bench = false
