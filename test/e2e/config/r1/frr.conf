! r1: FRR, AS 64510. Peers srv-a and srv-c (herald) and r2 (BIRD).
! herald only connects actively, so its neighbors are passive here.
frr defaults traditional
hostname r1
log stdout informational
! stdout logging stops after a while in the container; scenarios read the file.
log file /tmp/frr.log debugging
log timestamp precision 3
ip forwarding
ipv6 forwarding
!
router bgp 64510
 bgp router-id 203.0.113.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 3 9
 neighbor 10.201.11.10 remote-as 64500
 neighbor 10.201.11.10 description srv-a
 neighbor 10.201.11.10 passive
 neighbor 10.201.11.10 advertisement-interval 0
 neighbor 10.201.0.10 remote-as 64502
 neighbor 10.201.0.10 description srv-c
 neighbor 10.201.0.10 passive
 neighbor 10.201.0.10 advertisement-interval 0
 neighbor 10.201.0.3 remote-as 64511
 neighbor 10.201.0.3 description r2
 neighbor 10.201.0.3 advertisement-interval 0
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.201.11.10 activate
  neighbor 10.201.0.10 activate
  neighbor 10.201.0.3 activate
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  neighbor 10.201.11.10 activate
  neighbor 10.201.0.10 activate
  neighbor 10.201.0.3 activate
 exit-address-family
!
