# r2: BIRD 3, AS 64511. Peers srv-b and srv-c (herald) and r1 (FRR).
# herald only connects actively, so its neighbors are passive here.

log stderr all;
router id 203.0.113.12;

protocol device {}

# Connected networks, redistributed into BGP (user subnets must be
# reachable across core for return traffic).
protocol direct {
    ipv4;
    ipv6;
}

# Install BGP routes; connected routes are already in the kernel.
# scan time 2: BIRD 3.1.4 sometimes logs "replaced" for a quick best path
# flip (srv_b -> r1 -> srv_b) without changing the kernel route; only the
# next scan repairs it (default scan time: ~25 s lag measured 2026-11-02).
protocol kernel {
    scan time 2;
    ipv4 { export where source != RTS_DEVICE; };
}
protocol kernel {
    scan time 2;
    ipv6 { export where source != RTS_DEVICE; };
}

template bgp tpl_peer {
    local as 64511;
    hold time 9;
    keepalive time 3;
    connect retry time 5;
    # Default 60-300 s after errors; scenarios provoke errors on purpose.
    error wait time 1, 10;
    error forget time 30;
    enable extended messages on;
}

# Sessions run over IPv4 and carry IPv6 too; BIRD needs our IPv6 next hop
# for those spelled out.
protocol bgp r1 from tpl_peer {
    local 10.201.0.3;
    neighbor 10.201.0.2 as 64510;
    ipv4 { import all; export all; };
    ipv6 { import all; export all; next hop address 2001:db8:201::3; };
}

protocol bgp srv_b from tpl_peer {
    local 10.201.12.2;
    neighbor 10.201.12.10 as 64500;
    passive on;
    ipv4 { import all; export all; };
    ipv6 { import all; export all; next hop address 2001:db8:201:12::2; };
}

protocol bgp srv_c from tpl_peer {
    local 10.201.0.3;
    neighbor 10.201.0.10 as 64502;
    passive on;
    ipv4 { import all; export all; };
    ipv6 { import all; export all; next hop address 2001:db8:201::3; };
}
