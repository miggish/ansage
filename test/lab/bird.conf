# BIRD 3 lab peer for herald. Runs with host networking and only binds
# 127.0.0.2:179; herald connects from 127.0.0.1.
# Documentation values only: AS 64501 (RFC 5398), router ID from TEST-NET-3.

log stderr all;
router id 203.0.113.2;

protocol device {}

# Routes BIRD sends to herald, so herald's receive path sees real UPDATEs.
protocol static static4 {
    ipv4;
    route 198.51.100.0/24 blackhole;
}

protocol static static6 {
    ipv6;
    route 2001:db8:ffff::/48 blackhole;
}

protocol bgp herald {
    description "herald under test";
    local 127.0.0.2 port 179 as 64501;
    neighbor 127.0.0.1 as 64500;
    strict bind on;
    passive on;      # herald connects actively
    multihop;        # loopback is not a directly connected network for BIRD
    hold time 90;

    ipv4 {
        import all;
        export all;
    };

    ipv6 {
        import all;
        export all;
        # IPv6 routes over an IPv4 session need an explicit IPv6 next hop.
        next hop address 2001:db8:ffff::2;
    };
}
