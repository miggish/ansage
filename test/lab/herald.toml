# herald lab config: talks to BIRD from lab/bird.conf (just lab-up).
# Documentation values only (RFC 5398 ASNs, TEST-NET-3 router IDs).

asn = 64500
router_id = "203.0.113.1"
hold_time = 90
connect_retry = 5

# Our prefixes (RFC 5737 / RFC 3849 documentation ranges).
announce = ["192.0.2.0/24", "2001:db8:1::/48"]

# Control socket for `herald show` (relative to where herald runs, `just lab-run`).
control_socket = "target/herald-lab.sock"

[[neighbor]]
address = "127.0.0.2"
asn = 64501
description = "BIRD lab container"
# The lab session runs over IPv4, so IPv6 routes need an explicit next hop.
# IPv4 uses the default: our local address of the session (127.0.0.1).
next_hop_ipv6 = "2001:db8::1"
# Keep the routes BIRD sends (default "none", RFC 8212).
import = "all"
