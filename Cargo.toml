[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Ansage Contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/miggish/ansage"

[workspace.dependencies]
ansage-bgp = { path = "crates/ansage-bgp" }
ansage-netlink = { path = "crates/ansage-netlink" }

bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
# A panic anywhere ends ansage (systemd restarts it) instead of leaving a
# half-dead daemon; the panic hook tells the neighbors first
# (crates/ansage/src/peer/crash.rs).
panic = "abort"
